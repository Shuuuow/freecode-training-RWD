<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Styled To-Do List</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="learn-rust" />
                <label for="learn-rust">Learn Rust</label>
                <ul class="sub-item">
                    <li>
                        <a
                            class="sub-item-link"
                            href="https://rust-lang.org/"
                            target="_blank"
                        >
                            Rust Official Website
                        </a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="learn-python" />
                <label for="learn-python">Learn Python</label>
                <ul class="sub-item">
                    <li>
                        <a
                            class="sub-item-link"
                            href="https://www.python.org/"
                            target="_blank"
                        >
                            Python Official Website
                        </a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="learn-dart" />
                <label for="learn-dart">Learn Dart</label>
                <ul class="sub-item">
                    <li>
                        <a
                            class="sub-item-link"
                            href="https://dart.dev/"
                            target="_blank"
                        >
                            Dart Official Website
                        </a>
                    </li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="learn-ai" />
                <label for="learn-ai">Learn AI</label>
                <ul class="sub-item">
                    <li>
                        <a
                            class="sub-item-link"
                            href="https://pytorch.org/"
                            target="_blank"
                        >
                            Pythorch for AI development
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </body>
</html>
