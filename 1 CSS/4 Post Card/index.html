<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Blog Post Card</title>
    </head>
    <body>
        <div class="blog-post-card">
            <img
                class="post-img"
                src="https://images.seeklogo.com/logo-png/46/1/rust-logo-png_seeklogo-464002.png"
                alt="Rust Logo"
            />
            <div class="post-content">
                <h2 class="post-title">Rust Programming Language</h2>
                <p class="post-excerpt">
                    Rust is a systems programming language that focuses on
                    safety, speed, and concurrency.
                </p>
                <a class="read-more" href="https://rust-lang.org/">Read More</a>
            </div>
        </div>
    </body>
</html>
