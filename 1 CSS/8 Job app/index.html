<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="styles.css" />
        <title>Job Application Form</title>
    </head>
    <body>
        <div class="container">
            <form>
                <h1>Programming Job Application</h1>

                <label for="name">Full name:</label>
                <input type="text" id="name" name="name" required />
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />
                <label for="position">Position:</label>
                <select id="position">
                    <option value="0" selected disabled required>Select a position</option>
                    <option value="1">Frontend Developer</option>
                    <option value="2">Backend Developer</option>
                    <option value="3">Fullstack Developer</option>
                </select>

                <fieldset class="radio-group">
                    <legend>Job Type</legend>
                    <label><input type="radio" name="availability" value="full-time" /> Full-time</label>
                    <label><input type="radio" name="availability" value="part-time" /> Part-time</label>
                    <label><input type="radio" name="availability" value="contract" /> Contract</label>
                </fieldset>

                <label for="message">Teckstak used:</label>
                <textarea placeholder="langugue, database systems ... etc" id="message"></textarea>

                <button type="submit">Submit</button>
            </form>
        </div>
    </body>
</html>
