<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Selection Feature Page</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <h1>Feature Selection</h1>
        <div class="feature-card-container">
            <div class="option">
                <label class="feature-card">
                    <input type="checkbox" />
                    Escalating Exposure
                    <p>
                        Dealing spirit damage applies a stacking Spirit Amp that
                        increases your spirit damage to the target.
                    </p>
                </label>
            </div>
            <div class="option">
                <label class="feature-card">
                    <input type="checkbox" />
                    Greater Expansion
                    <p>
                        Increases the range and effect radius of your abilities
                        and items.
                    </p>
                </label>
            </div>
        </div>
    </body>
</html>
