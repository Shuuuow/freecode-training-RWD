<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML Audio and Video Lab</title>
    </head>
    <body>
        <h1>Cute Cats</h1>
        <section>
            <h2>Cats - Video</h2>
            <video controls width="640">
                <source
                    src="https://media.istockphoto.com/id/1469733028/video/a-kitten-is-looking-and-want-to-touch-the-camera-lens.mp4"
                    type="video/mp4"
                />
            </video>
        </section>
        <section>
            <h2>Meow - Audio</h2>
            <audio
                controls
                loop
                src="https://www.myinstants.com/media/sounds/cat-meow-mp3.mp3"
                type="audio/mp3"
            ></audio>
        </section>
    </body>
</html>
