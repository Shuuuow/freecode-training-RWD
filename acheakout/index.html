<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Checkout</title>
    </head>

    <body>
        <h1>Checkout</h1>
        <section>
            <h2>Your Cart</h2>
            <img
                src="https://kuffiyah.com/wp-content/uploads/2024/06/keffiyeh-black-white-product-photo-600x600.png"
                alt="A Palestinian Kuffiyah"
            />
        </section>
        <section>
            <h2>Payment Information</h2>
            <form>
                <label for="card-name"
                    >Card Name <span aria-hidden="true">*</span></label
                >
                <input
                    type="text"
                    id="card-name"
                    name="card-name"
                    required
                />
                <label for="card-number"
                    >Card Number <span aria-hidden="true">*</span></label
                >
                <input
                    type="text"
                    id="card-number"
                    name="card-number"
                    placeholder="1234 - 5678 - 9876 -5432"
                    aria-describedby="card-number-help"
                    required
                />
                <p id="card-number-help">Enter your 16 digit card number in the correct format</p>
            </form>
        </section>
    </body>
</html>
